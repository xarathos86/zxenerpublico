<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanidad Vegetal · Acceso al cuaderno</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:25px;background:#edf0df;color:#123d27;font:17px/1.6 Georgia,serif;background-image:radial-gradient(ellipse at top left,#b9d09580,transparent 60%)}main{max-width:540px;padding:50px;background:#faf8ef;border:1px solid #d4ddc4;border-radius:22px;box-shadow:0 25px 80px #123d2715}small,label,button,input{font-family:Arial,sans-serif}small{letter-spacing:2px;font-size:10px}h1{font-size:45px;font-weight:normal;line-height:1.05}em{color:#718845}label{display:block;font-size:13px;margin-top:25px}input{width:100%;padding:14px;margin:8px 0 15px;border:1px solid #aebd9a;border-radius:6px;font-size:18px}button{width:100%;padding:15px;border:0;background:#123d27;color:white;border-radius:6px;cursor:pointer;font-size:15px}button:disabled{opacity:.65}footer{font-size:12px;margin-top:28px}#status{font-size:14px;min-height:25px}input:focus-visible,button:focus-visible{outline:3px solid #d3a533;outline-offset:3px}</style></head><body><main><small>❧ UNAHUR · FUNDAMENTOS DE SANIDAD VEGETAL</small><h1>Un mundo por<br><em>descubrir.</em></h1><p>Entrá al cuaderno interactivo de <i>Rachiplusia nu</i>, la oruga medidora.</p><form id="unlock"><label for="password">Clave de acceso</label><input id="password" type="password" required autocomplete="current-password" autofocus><button id="enter" type="submit">Abrir guía de estudio ↗</button><p id="status" role="status" aria-live="polite"></p></form><footer>Carlos Arturo d'Albuquerque<br>Tecnicatura Universitaria en Viverismo</footer></main><script>
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let encrypted;
document.querySelector('#unlock').onsubmit=async e=>{e.preventDefault();const status=document.querySelector('#status'),button=document.querySelector('#enter');button.disabled=true;status.textContent='Abriendo el cuaderno… La primera carga puede tardar por las láminas.';let phase='fetch';try{if(!crypto.subtle)throw Error('HTTPS_REQUIRED');if(!encrypted){const response=await fetch('contenido.bin');if(!response.ok)throw Error('DOWNLOAD');encrypted=await response.arrayBuffer()}phase='decrypt';const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.querySelector('#password').value.trim()),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode('2+Wa024G/d56TDOV+aA6cg=='),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode('qQIjqi5fpnk0eCEW')},key,encrypted);phase='render';const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(error){status.textContent=phase==='decrypt'?'La clave no es correcta. Probá otra vez.':phase==='fetch'?'No se pudo cargar el cuaderno. Abrí el enlace HTTPS publicado y revisá la conexión.':'Este navegador no pudo abrir el cuaderno. Probá con una versión reciente de Chrome, Edge, Firefox o Safari.';button.disabled=false}};
</script></body></html>
