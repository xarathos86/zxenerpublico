<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoTePo · Acceso</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf9f2;color:#233f31;font:16px/1.6 Arial,sans-serif;padding:24px}main{width:100%;max-width:440px;border:1px solid #ccd5c5;border-radius:20px;padding:40px;background:#eef1e6}small{letter-spacing:2px;font-size:10px}h1{font:40px/1.1 Georgia,serif}label{display:block;margin-bottom:8px}input,button{width:100%;font:inherit;border-radius:24px;padding:12px 20px}input{border:1px solid #a9b7a1;background:#faf9f2}button{margin-top:20px;background:#233f31;color:white;border:0;cursor:pointer}button:disabled{opacity:.6}#status{min-height:26px;font-size:14px}a{color:inherit}</style></head><body><main><small>CUADERNO DE ESTUDIO · ACCESO CON CONTRASEÑA</small><h1>CoTePo</h1><p>Ingresá la contraseña compartida con tu grupo para abrir la web.</p><form id="login"><label for="password">Contraseña</label><input id="password" type="password" inputmode="numeric" required autocomplete="current-password" autofocus><button id="enter">Entrar a estudiar ↗</button><p id="status" role="status" aria-live="polite"></p></form><small>El acceso se cierra a las 8 horas o al tocar «Cerrar acceso».</small></main><script>
const status=document.getElementById('status'),button=document.getElementById('enter');
document.getElementById('login').onsubmit=async e=>{e.preventDefault();button.disabled=true;status.textContent='Abriendo tu cuaderno…';try{if(!('serviceWorker' in navigator))throw Error('Este navegador no admite el acceso. Probá con Chrome, Safari, Edge o Firefox.');const m=await fetch('manifest.json',{cache:'no-store'}).then(r=>r.json());const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:Uint8Array.from(atob(m.salt),c=>c.charCodeAt(0)),iterations:m.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},true,['decrypt']);const r=await fetch('vault/'+m.entries['index.html'].file);const enc=await r.arrayBuffer();try{await crypto.subtle.decrypt({name:'AES-GCM',iv:enc.slice(0,12)},key,enc.slice(12))}catch{throw Error('Contraseña incorrecta. Volvé a intentarlo.')}await navigator.serviceWorker.register('sw.js');const reg=await navigator.serviceWorker.ready;await new Promise((ok,no)=>{const c=new MessageChannel();c.port1.onmessage=e=>e.data.ok?ok():no(Error('No se pudo guardar el acceso.'));crypto.subtle.exportKey('raw',key).then(raw=>reg.active.postMessage({type:'UNLOCK',key:raw},[c.port2]))});if(!navigator.serviceWorker.controller)await new Promise(ok=>{navigator.serviceWorker.addEventListener('controllerchange',ok,{once:true});if(navigator.serviceWorker.controller)ok()});location.href='contenido/index.html'}catch(err){status.textContent=err.message;button.disabled=false}};
</script></body></html>
